name: Collect CVE data

on:
  schedule:
    - cron: "0 0 * * *"  # 매일 00:00 UTC (KST 09:00)
    - cron: "0 3 * * *"  # 매일 03:00 UTC (KST 12:00)
    - cron: "0 8 * * *"  # 매일 08:00 UTC (KST 17:00)
  workflow_dispatch:
    inputs:
      days:
        description: "상태 파일 무시하고 최근 N일치 신규 CVE 후보를 강제로 풀에 유입 (백필용, 비워두면 증분 수집)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: cve-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # GitHub Search API 30회/분이 병목이라 재검사 건수 x 2.2초가 그대로 실행 시간이 된다.
    # 재검사 스케줄이 11단계로 촘촘해지면서 정상 실행이 60분대가 됐고, 스케줄 변경 직후
    # 한 번은 밀린 후보가 몰려 그보다 길어진다. --max-github-checks(1800) 가 실질 상한.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scripts
          ARGS=""
          if [ -n "${{ github.event.inputs.days }}" ]; then
            ARGS="--days ${{ github.event.inputs.days }}"
          fi
          python collect.py $ARGS

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update CVE data ($(date -u +%Y-%m-%d))"
            # 하루 3회로 실행 빈도가 늘고 사람이 세션 중 수시로 push하면서
            # non-fast-forward 충돌이 나기 시작함(2026-08-31 최초 관측). 커밋 자체는
            # 이미 로컬에 있으니 rebase 재시도로 흡수한다.
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push rejected, retrying with rebase ($i/5)"
              git fetch origin master
              git rebase origin/master
              sleep $((i * 5))
            done
          fi

      # 아카이브에 잘못된 PoC 근거가 섞였는지 확인한다. GitHub 검색이 정확 일치가
      # 아니라 짧은 시퀀스 번호의 CVE가 긴 CVE에 잡아먹힌 적이 있어(아카이브 23% 오염),
      # 사람이 눈으로 발견하기 전에 CI가 잡도록 둔다. --purge-bad로 실제 제거까지
      # 자동화했다(2026-09-02, CVE-2026-24301 — 승격 근거였던 저장소가 나중에 삭제돼
      # verify가 매 실행마다 잡던 걸 사람이 수동 정리한 뒤 추가). manifest/연간·study md만
      # 지우고 analysis.json은 사람이 손댄 값이 있으면 절대 안 건드리므로 안전하다.
      - name: Verify archive integrity
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scripts
          python collect.py --verify --purge-bad

      - name: Commit purge changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data README.md
          if git diff --cached --quiet; then
            echo "No purge changes to commit"
          else
            git commit -m "fix: verify가 잡은 오매칭/근거소실 항목 자동 정리 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push rejected, retrying with rebase ($i/5)"
              git fetch origin master
              git rebase origin/master
              sleep $((i * 5))
            done
          fi
