name: Collect CVE data

on:
  # 2026-09-19 Actions 무료 한도(월 2,000분) 소진 사고 이후 하루 3회에서 1회로 되돌림 +
  # verify 비용을 --verify-batch-size로 고정(2026-10-01, 영구조치). 이 저장소는 그 조치를
  # 못 받고 하루 3회+전체verify 그대로 돌다가 2026-10-07 push 실패를 계기로 뒤늦게 동일하게
  # 맞춤. 스케줄을 다시 늘리고 싶으면 이 사고 경위부터 다시 읽을 것.
  schedule:
    - cron: "0 0 * * *"  # 매일 00:00 UTC (KST 09:00)
  workflow_dispatch:
    inputs:
      days:
        description: "상태 파일 무시하고 최근 N일치 신규 CVE 후보를 강제로 풀에 유입 (백필용, 비워두면 증분 수집)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: cve-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scripts
          ARGS=""
          if [ -n "${{ github.event.inputs.days }}" ]; then
            ARGS="--days ${{ github.event.inputs.days }}"
          fi
          python collect.py $ARGS

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update CVE data ($(date -u +%Y-%m-%d))"
            # 2026-10-07: 재시도 로직이 origin/master를 하드코딩해서 이 저장소의 실제
            # 기본브랜치(main)와 안 맞아 재시도가 즉시 fatal로 죽던 버그 수정 (push가
            # GitHub측 일시 500에러로 거부됐을 때 재시도 자체가 불가능했던 원인).
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push rejected, retrying with rebase ($i/5)"
              git fetch origin main
              git rebase origin/main
              sleep $((i * 5))
            done
          fi

      # 매번 전체 재검사 대신 .state.json의 verify_scan_index 커서로 300건씩만 순환검사해
      # 회당 비용을 아카이브 크기와 무관하게 고정한다(2026-10-01 영구조치). 아래 if 조건은
      # cron이 다시 여러 개로 늘어나도 verify가 하루 한 번만 돌도록 막는 안전장치다.
      - name: Verify archive integrity (daily only)
        if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scripts
          python collect.py --verify --purge-bad --verify-batch-size 300

      - name: Commit purge changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data README.md
          if git diff --cached --quiet; then
            echo "No purge changes to commit"
          else
            git commit -m "fix: verify가 잡은 오매칭/근거소실 항목 자동 정리 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push rejected, retrying with rebase ($i/5)"
              git fetch origin main
              git rebase origin/main
              sleep $((i * 5))
            done
          fi
